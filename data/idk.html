<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Tu pedido está en camino | Esencia Vital</title>

	<link rel="stylesheet" href="style/index.css">
	<link rel="stylesheet" href="style/shop.css">
</head>

<body>
	<header class="site-header">
		<a class="logo" href="../index.html">Esencia Vital</a>

		<nav class="site-nav" aria-label="Navegación principal">
			<a href="../index.html">Inicio</a>
			<a href="../index.html#about-us">Sobre nosotros</a>
			<a href="shop.html">Tienda</a>
		</nav>
	</header>

	<main class="pedido">
		<div class="truck" role="img" aria-label="Camión de reparto en movimiento">
			<svg viewBox="0 0 200 100" aria-hidden="true">
				<g class="truck-body">
					<!-- Caja de carga -->
					<rect x="8" y="14" width="126" height="62" rx="6" fill="#36ADF7"/>
					<text x="71" y="50" text-anchor="middle" font-size="13" font-weight="bold" fill="#09152B">Esencia Vital</text>
					<!-- Cabina -->
					<path d="M138 36h34l22 24v16h-56z" fill="#09152B"/>
					<path d="M145 43h24l15 17h-39z" fill="#8ED1FA"/>
					<!-- Chasis -->
					<rect x="8" y="76" width="186" height="6" rx="3" fill="#354354"/>
				</g>

				<g class="wheel">
					<circle cx="42" cy="86" r="12" fill="#09152B"/>
					<circle cx="42" cy="86" r="4" fill="#8ED1FA"/>
					<path d="M42 78v16M34 86h16" stroke="#8ED1FA" stroke-width="2" stroke-linecap="round"/>
				</g>
				<g class="wheel">
					<circle cx="160" cy="86" r="12" fill="#09152B"/>
					<circle cx="160" cy="86" r="4" fill="#8ED1FA"/>
					<path d="M160 78v16M152 86h16" stroke="#8ED1FA" stroke-width="2" stroke-linecap="round"/>
				</g>
			</svg>

			<div class="road" aria-hidden="true"></div>
		</div>

		<h1>¡Tu pedido está en camino!</h1>
		<p>Gracias por elegir Esencia Vital. Muy pronto llegará a tu puerta.</p>

		<div class="actions">
			<a class="btn" href="../index.html">Volver al inicio</a>
			<a class="btn btn-claro" href="shop.html">Volver a la tienda</a>
		</div>
	</main>

	<footer>
		<p>&copy; Vitalabs S.A.S.</p>
	</footer>
</body>

</html>
