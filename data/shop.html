<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Tienda | Esencia Vital</title>

	<!-- index.css trae el encabezado, los botones y el pie de página -->
	<link rel="stylesheet" href="style/index.css">
	<link rel="stylesheet" href="style/shop.css">
</head>

<body>
	<header class="site-header">
		<a class="logo" href="../index.html">Esencia Vital</a>

		<nav class="site-nav" aria-label="Navegación principal">
			<a href="../index.html">Inicio</a>
			<a href="../index.html#about-us">Sobre nosotros</a>
			<a href="shop.html" aria-current="page">Tienda</a>
		</nav>
	</header>

	<main class="tienda">
		<h1>Tienda</h1>

		<div class="cards">
			<article class="card">
				<img src="images/esencia.png" alt="Esencia Vital, jabón líquido">

				<h2>Jabón líquido <em>Esencia Vital</em> 250&nbsp;ml</h2>

				<p class="price">$12.000 COP</p>

				<form action="idk.html" method="get">
					<div class="qty">
						<label for="cantidad">Cantidad</label>
						<input id="cantidad" name="cantidad" type="number" min="1" max="99" value="1">
					</div>

					<button class="btn" type="submit">Ordenar</button>
				</form>
			</article>

			<article class="card card-soon">
				<h2>Próximamente</h2>
				<p>Estamos preparando nuevos productos.</p>
			</article>
		</div>
	</main>

	<footer>
		<p>&copy; Vitalabs S.A.S.</p>
	</footer>
</body>

</html>
